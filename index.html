<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Herramix Agente</title>
<meta name="description" content="Agenda de ventas, seguimiento de clientes y taller de tarjetas y menús digitales. Funciona sin internet.">
<meta name="theme-color" content="#16243A">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
 --bg:#F4F1EB;--panel:#FFFFFF;--panel2:#FAF8F4;--ink:#17202C;--mut:#5D6672;--mut2:#8A919B;--line:#E4DFD6;
 --brand:#16243A;--brand2:#24406A;--acc:#E0A23A;--ok:#1E8E5A;--okbg:#E2F3EA;--warn:#B7791F;--warnbg:#FFF3D6;--bad:#C2413A;--badbg:#FBE6E4;--info:#2B6CB0;--infobg:#E5EEF8;
 --wa:#1FAF5A;--r:14px;--sh:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
 --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-ahorro="1"]{--bg:#0B0E13;--panel:#12161D;--panel2:#161B23;--ink:#E7EAEE;--mut:#A2AAB5;--mut2:#7D8592;--line:#232A35;--brand:#0B0E13;--brand2:#1B2533;--okbg:#10291D;--warnbg:#2B2210;--badbg:#2E1513;--infobg:#122133;--sh:none}
:root[data-ahorro="1"] *{transition:none!important;animation:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.45 var(--f);background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.top{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
.top .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#F2C76B);display:grid;place-items:center;font-weight:800;color:#16243A;font-size:15px;flex:none}
.top h1{font-size:16px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.top .sub{font-size:11.5px;opacity:.72}
.top .stat{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:#9AA3AE;display:inline-block}
.pill.on i{background:#3DD68C}.pill.off i{background:#F07167}
main{max-width:860px;margin:0 auto;padding:14px 14px 30px}
.scr[hidden]{display:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mut2);position:relative}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--brand2)}
:root[data-ahorro="1"] nav.bottom button.on{color:var(--acc)}
nav.bottom .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}
@media(min-width:960px){body{padding-bottom:0;padding-left:92px}nav.bottom{top:0;bottom:0;right:auto;width:92px;grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding-top:70px}nav.bottom button{padding:14px 4px}.top{margin-left:-92px;padding-left:108px}}
h2{font-size:21px;line-height:1.2;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
.lead{color:var(--mut);margin-top:4px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.mut2{color:var(--mut2)}.sm{font-size:13px}.xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#16243A}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.gh{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.A{background:var(--okbg);border-color:transparent;color:var(--ok)}.tag.B{background:var(--warnbg);border-color:transparent;color:var(--warn)}.tag.C{background:var(--panel2)}
.tag.info{background:var(--infobg);border-color:transparent;color:var(--info)}.tag.bad{background:var(--badbg);border-color:transparent;color:var(--bad)}.tag.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}.tag.warn{background:var(--warnbg);border-color:transparent;color:var(--warn)}
input[type=text],input[type=number],input[type=search],input[type=tel],input[type=email],input[type=url],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 11px;font-size:15px;outline:none}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(36,64,106,.15)}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--mut2);margin-top:5px}
/* tareas */
.task{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:4px}
.task .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.task .ic.cobrar{background:var(--okbg)}.task .ic.entregar{background:var(--infobg)}.task .ic.muestra{background:var(--warnbg)}.task .ic.seguir{background:var(--panel2)}.task .ic.nuevo{background:var(--panel2)}.task .ic.preparar{background:var(--infobg)}.task .ic.recom{background:var(--okbg)}
.task .t{font-weight:700;line-height:1.25}
.task .d{font-size:13px;color:var(--mut);margin-top:2px}
.task .acts{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.task.done{opacity:.45}
.task.done .t{text-decoration:line-through}
.timer{font:700 30px/1 var(--fm);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc)}
.banner{border-radius:12px;padding:11px 13px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warnbg)}.banner.info{background:var(--infobg)}.banner.bad{background:var(--badbg)}.banner.ok{background:var(--okbg)}
/* prospectos */
.plist{display:grid;gap:8px}
.pitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer}
.pitem .n{font-weight:700;line-height:1.25}
.pitem .m{font-size:12.5px;color:var(--mut);grid-column:1}
.pitem .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.funnel{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.funnel div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer}
.funnel div.on{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(36,64,106,.18)}
.funnel b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.funnel span{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;line-height:1.15;display:block}
@media(max-width:560px){.funnel{grid-template-columns:repeat(3,1fr)}}
/* hoja lateral */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(10,15,25,.45)}
.sheet[hidden]{display:none}
.sheet .in{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:0 0 40px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.sheet .hd{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;gap:10px;align-items:center;z-index:2}
.sheet .bd{padding:14px;display:grid;gap:12px}
.x{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.log{font-size:13px;display:grid;gap:6px}
.log div{display:grid;grid-template-columns:auto 1fr;gap:8px}
.log time{color:var(--mut2);font-family:var(--fm);font-size:11.5px;padding-top:1px}
.msgbox{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
/* taller */
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.tpl{grid-template-columns:repeat(2,1fr)}}
.tpl button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0;overflow:hidden;text-align:left;cursor:pointer}
.tpl button.on{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(36,64,106,.18)}
.tpl .sw{height:46px;display:flex;align-items:flex-end;padding:6px 8px;gap:4px}
.tpl .sw i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.tpl b{display:block;padding:7px 9px 1px;font-size:13.5px}
.tpl span{display:block;padding:0 9px 8px;font-size:11.5px;color:var(--mut)}
.prev{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#ddd}
.prev iframe{display:block;width:100%;height:640px;border:0;background:#fff}
.tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs div{position:relative;width:70px;height:70px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#17202C;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,440px);opacity:0;transition:.2s;pointer-events:none;z-index:80;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mut);padding:26px 12px;font-size:14px}
details.more summary{cursor:pointer;font-weight:700;padding:4px 0}
.sep{height:1px;background:var(--line);margin:4px 0}
.k{font-family:var(--fm);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
</style>
</head>

  const link = k ? s.base.replace(/\/?$/, '/') + k.slug + '/' : '[enlace]';
  const v = {
    negocio: p ? p.nombre.replace(/\s*\(.*\)$/, '') : '[negocio]', yo: s.yo, nombre: s.nombre, wa: s.wa, marca: s.marca,
    qvapay: s.qvapay || '[tu usuario de QvaPay]', tarjeta: s.tarjeta || '[tu tarjeta]',
    precio_kit: s.precio_kit + ' USD', precio_agente: s.precio_agente + ' USD', comision: s.comision,
    precio: p?.valor ? p.valor + ' USD' : s.precio_kit + ' USD',
    producto: k ? (k.tipo === 'renta' ? 'tarjeta digital' : 'menú digital') : 'tarjeta digital',
    enlace_tarjeta: link + 'tarjeta.html', enlace_menu: link + 'menu.html', vitrina: s.vitrina, ...extra
  };
  return String(text).replace(/\{(\w+)\}/g, (m, x) => v[x] ?? m);
}
const msgFor = (kind, p) => fill(tpl(kind, sk(p)), p);
const waNum = p => (p.movil || '').split(' / ')[0];
const waLink = (p, text) => waNum(p) ? 'https://wa.me/53' + waNum(p) + '?text=' + encodeURIComponent(text) : null;
function mailLink(p, kind) {
  const mail = (p.mail || '').split(';')[0].trim(); if (!mail) return null;
  const subj = fill(S.msgs['correo_asunto.' + sk(p)] || MSG_DEF.correo_asunto[sk(p)] || MSG_DEF.correo_asunto._, p);
  const body = msgFor(kind, p).replace(/^Hola, ¿es [^?]+\? /, 'Buenos días:\n\n') + '\n\nSaludos,\n' + set().nombre + ' · ' + set().marca + '\nWhatsApp ' + set().wa;
  return 'mailto:' + mail + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
}

/* ---------- avanzar en el embudo ---------- */
function logp(p, txt) { p.log.unshift({ ts: Date.now(), txt }); if (p.log.length > 60) p.log.length = 60; }
function moveTo(p, stage, note) {
  const st = ST[stage]; p.stage = stage;
  p.due = st.days != null ? today() + st.days * DAY : null;
  logp(p, note || ('→ ' + st.n));
  save();
}
/* qué pasa al marcar hecha cada tarea */
const DONE = {
  contactar: p => { dayStat().contactos++; moveTo(p, 'contactado', 'Primer mensaje enviado'); },
  recordar: p => moveTo(p, 'recordado', 'Recordatorio enviado'),
  cerrar: p => moveTo(p, 'descartado', 'Cerrado: no respondió'),
  muestra: p => moveTo(p, 'muestra', 'Muestra y precio enviados'),
  seguir: p => { p.due = today() + 3 * DAY; logp(p, 'Seguimiento enviado'); save(); },
  entregar: p => moveTo(p, 'entregado', 'Kit entregado'),
  cobrar: p => cobrar(p),
  recomendar: p => moveTo(p, 'fidelizado', 'Recomendación pedida'),
  preparar: p => { p.prepared = true; logp(p, 'Muestra personalizada preparada'); save(); }
};
function cobrar(p, monto) {
  const v = +(monto ?? p.valor ?? set().precio_kit);
  S.sales.unshift({ id: uid(), pid: p.id, nombre: p.nombre, monto: v, moneda: 'USD', ts: Date.now(), concepto: p.kit ? 'Kit ' + (S.kits[p.kit]?.tipo || '') : 'Kit' });
  p.valor = v; moveTo(p, 'cliente', 'Cobrado: ' + money(v));
}

/* ---------- tareas del día ---------- */
function allTasks() {
  const t0 = today(), out = [], s = set();
  for (const p of S.prospects) {
    const st = ST[p.stage]; if (!st?.next) continue;
    if (p.stage === 'nuevo') continue;
    if (p.due != null && p.due > t0 && !['interesado', 'produccion', 'entregado'].includes(p.stage)) continue;
    const late = p.due != null ? Math.max(0, Math.round((t0 - p.due) / DAY)) : 0;
    out.push({ kind: st.next, p, late });
  }
  /* contactos nuevos: hasta el límite del día, por prioridad */
  const hechos = dayStat().contactos, cupo = Math.max(0, s.limite - hechos);
  const nuevos = S.prospects.filter(p => p.stage === 'nuevo' && (p.movil || p.mail))
    .sort((a, b) => a.pri.localeCompare(b.pri) || (b.prepared - a.prepared) || ((b.movil ? 2 : 0) + (b.mail ? 1 : 0)) - ((a.movil ? 2 : 0) + (a.mail ? 1 : 0)));
  nuevos.slice(0, cupo).forEach(p => out.push({ kind: 'contactar', p, late: 0 }));
  /* preparar muestras de los siguientes (se hace sin internet) */
  nuevos.slice(0, cupo + 3).filter(p => !p.prepared && SECT[p.grupo]?.kit).slice(0, 3).forEach(p => out.push({ kind: 'preparar', p, late: 0, opt: true }));
  return out.sort((a, b) => (TASKS[b.kind].w + b.late * 5) - (TASKS[a.kind].w + a.late * 5));
}
/* plan para una ventana de N minutos, según haya o no conexión */
function plan(min, online) {
  const tasks = allTasks(), sel = [], cola = []; let t = 0;
  for (const x of tasks) {
    const T = TASKS[x.kind];
    if (T.net && !online) { cola.push(x); continue; }
    if (t + T.min > min) continue;
    sel.push(x); t += T.min;
  }
  return { sel, cola, total: t, all: tasks.length };
}

const fmtLeft = ms => { const s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function startSession(min) {

  save(); renderHoy(); toast(`Plan listo: ${pl.sel.length} tareas, unos ${pl.total} minutos.`);
}
function endSession() {
  if (!S.session) return;
  const mins = Math.round((Date.now() - S.session.start) / 6e4), d = dayStat();
  d.minutos += mins; d.hechas += S.session.done.length;
  toast(`Ventana cerrada: ${S.session.done.length} tareas en ${mins} min.`);
  S.session = null; save(); renderHoy(); status();
}
function tick() {
  const s = S.session; if (!s) return;
  const left = s.start + s.min * 6e4 - Date.now();
  const t = $('#tmr'); if (t) t.textContent = fmtLeft(Math.max(0, left));
  const b = $('#tmrBar'); if (b) b.style.width = Math.min(100, (1 - Math.max(0, left) / (s.min * 6e4)) * 100) + '%';
  if (left <= 0 && !s.avisado) { s.avisado = true; save(); notify('Se acabó tu ventana de trabajo', `Hiciste ${s.done.length} de ${s.items.length} tareas.`); toast('Se acabó el tiempo de la ventana.'); }
}
function notify(title, body) {
  if (!set().avisos) return;
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body, icon: ICON_DATA, tag: 'hx' }); } catch (e) { }

}

function parseItems(txt) {
  const out = []; let cur = null;
  String(txt || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
    if (l.startsWith('#')) { cur = { cat: l.replace(/^#+\s*/, ''), items: [] }; out.push(cur); return; }
    if (!cur) { cur = { cat: '', items: [] }; out.push(cur); }
    const parts = l.split('|').map(x => x.trim());
    const n = parts[0], pr = parts.length > 1 ? parts[parts.length - 1] : '', d = parts.length > 2 ? parts.slice(1, -1).join(' · ') : '';
    cur.items.push({ n, d, pr: /^\d[\d.,]*$/.test(pr) ? Number(pr.replace(/\./g, '').replace(',', '.')).toLocaleString('es-ES') + ' CUP' : pr });
  });

  const act = a.dataset.act, p = a.dataset.p && P(a.dataset.p), k = UI.kit && S.kits[UI.kit];
  if (a.tagName === 'A' && a.getAttribute('href') === '#') e.preventDefault();
  const markSess = () => { if (S.session && a.dataset.i != null && !String(a.dataset.i).startsWith('a')) { const i = +a.dataset.i; if (!S.session.done.includes(i)) S.session.done.push(i); } };
  switch (act) {
    case 'ventana': startSession(+a.dataset.m); break;
    case 'replan': { const m = Math.max(5, Math.round((S.session.start + S.session.min * 6e4 - Date.now()) / 6e4)); S.session = null; startSession(m); break; }
    case 'fin': endSession(); break;
    case 'hecho': if (!p) break; DONE[a.dataset.k](p); markSess(); save(); toast('Hecho: ' + (ST[p.stage].n)); refreshAll(); break;
    case 'cobrado': { if (!p) break; const v = prompt('¿Cuánto cobraste? (USD)', p.valor ?? set().precio_kit); if (v == null) break; cobrar(p, parseFloat(String(v).replace(',', '.')) || 0); markSess(); save(); toast('Cobro registrado 💵'); refreshAll(); break; }
    case 'invalido': moveTo(p, 'invalido', 'Número no válido'); toast('Marcado como número no válido'); refreshAll(); break;
    case 'si': moveTo(p, 'interesado', 'Respondió que sí ✓'); toast('¡Bien! Envíale la muestra y el precio.'); refreshAll(); break;
    case 'no': moveTo(p, 'descartado', 'Respondió que no'); toast('Anotado. No le volverás a ver en las tareas.'); refreshAll(); break;
    case 'datos': moveTo(p, 'produccion', 'Aceptó y mandó sus datos'); if (p.kit && S.kits[p.kit]) { S.kits[p.kit].muestra = false; } toast('Pasa al taller: entrega en 24 h.'); refreshAll(); break;
    case 'ficha': ficha(a.dataset.p); break;
    case 'taller': abrirKitDe(a.dataset.p); break;
    case 'sendwa': { const t = $('#fMsg').value, l = waLink(p, t); if (l) { open(l, '_blank', 'noopener'); logp(p, 'WhatsApp abierto'); save(); } break; }
    case 'copymsg': copy($('#fMsg').value); break;
    case 'guardarF': { p.stage = $('#fStage').value; const v = $('#fVal').value; p.valor = v === '' ? null : +v; const d = $('#fDue').value; p.due = d ? new Date(d + 'T00:00').getTime() : (ST[p.stage].days != null ? today() + ST[p.stage].days * DAY : null); p.movil = $('#fMov').value.replace(/[^\d /]/g, '').trim(); p.notas = $('#fNotas').value; logp(p, 'Ficha actualizada'); save(); toast('Guardado'); ficha(p.id); break; }
    case 'nuevoP': nuevoProspecto(); break;
    case 'crearP': { const n = $('#nN').value.trim(); if (!n) { toast('Escribe el nombre del negocio'); break; } const gg = $('#nG').value; const np = { id: 'p' + uid(), pri: { 'Gastronomía': 'A', 'Alojamiento': 'A', 'Belleza': 'A', 'Tecnología (socio)': 'A', 'Tiendas': 'B' }[gg] || 'C', grupo: gg, tipo: $('#nT').value.trim() || gg, nombre: n, dir: $('#nD').value.trim() || 'Holguín', movil: $('#nM').value.replace(/\D/g, '').replace(/^53(?=\d{8}$)/, ''), fijo: '', mail: $('#nE').value.trim(), web: '', oferta: '', nota: $('#nS').value.trim(), src: 'Añadido a mano', stage: 'nuevo', due: null, log: [{ ts: Date.now(), txt: 'Añadido a mano' }], valor: null, kit: null, prepared: false }; S.prospects.unshift(np); save(); ficha(np.id); toast('Añadido'); break; }
    case 'nuevoKit': { const nk = newKit(a.dataset.t, null); UI.kit = nk.id; UI.kview = 'datos'; renderTaller(); scrollTo(0, 0); break; }
    case 'abrirKit': UI.kit = a.dataset.k; UI.kview = 'datos'; renderTaller(); scrollTo(0, 0); break;
    case 'cerrarKit': UI.kit = null; renderTaller(); break;
    case 'dupKit': { const c = JSON.parse(JSON.stringify(k)); c.id = uid(); c.pid = null; c.nombre += ' (copia)'; c.slug = slugify(c.nombre) + '-' + c.id.slice(-4); c.updated = Date.now(); S.kits[c.id] = c; save(); UI.kit = c.id; UI.kview = 'datos'; renderTaller(); toast('Duplicado'); break; }
    case 'borrarKit': if (confirm('¿Borrar este trabajo?')) { const pp = k.pid && P(k.pid); if (pp) pp.kit = null; delete S.kits[k.id]; UI.kit = null; save(); renderTaller(); } break;
    case 'quitarFoto': k.fotos.splice(+a.dataset.i, 1); k.updated = Date.now(); save(); renderTaller(); break;
    case 'quitarImg': k[a.dataset.f] = null; k.updated = Date.now(); save(); renderTaller(); break;
    case 'zip': a.disabled = true; a.textContent = 'Preparando…'; await entregaZIP(k); a.disabled = false; a.textContent = '📦 Descargar todo (ZIP)'; toast('ZIP descargado'); break;
    case 'png': dl(k.slug + '-whatsapp.png', await imagenPNG(k)); toast('Imagen descargada: mándala por WhatsApp'); break;
    case 'print': imprimir(cartelHTML(k)); break;
    case 'waEntrega': case 'waMuestra': { const pp = P(k.pid); const t = msgFor(act === 'waEntrega' ? 'entregar' : 'muestra', pp); const l = waLink(pp, t); if (l) open(l, '_blank', 'noopener'); else copy(t); break; }
    case 'prepOK': { const pp = P(k.pid); DONE.preparar(pp); toast('Muestra lista: se usará al contactarlo.'); break; }
    case 'ventaManual': { const n = prompt('¿Quién te pagó? (nombre del cliente)'); if (!n) break; const v = parseFloat(String(prompt('¿Cuánto? (USD)', set().precio_kit) || '').replace(',', '.')); if (!v) break; S.sales.unshift({ id: uid(), pid: null, nombre: n, monto: v, moneda: 'USD', ts: Date.now(), concepto: 'Venta manual' }); save(); renderDinero(); break; }
    case 'borrarVenta': if (confirm('¿Borrar este cobro?')) { S.sales = S.sales.filter(v => v.id !== a.dataset.v); save(); renderDinero(); } break;
    case 'csv': { const rows = [['fecha', 'cliente', 'concepto', 'monto', 'moneda'], ...S.sales.map(v => [dkey(v.ts), v.nombre, v.concepto || '', v.monto, v.moneda])]; dl('herramix-cobros.csv', new Blob(['﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n')], { type: 'text/csv' })); break; }
    case 'guardarMsg': S.msgs[$('#mK').value + '.' + $('#mS').value] = $('#mT').value; save(); toast('Mensaje guardado'); break;
    case 'resetMsg': delete S.msgs[$('#mK').value + '.' + $('#mS').value]; save(); $('#mK').onchange(); toast('Mensaje original restaurado'); break;
    case 'backup': S.backupAt = Date.now(); await save(true); dl('herramix-agente-' + dkey() + '.json', new Blob([JSON.stringify(S)], { type: 'application/json' })); toast('Copia guardada en Descargas'); if (UI.scr === 'mas') renderMas(); break;
    case 'resumen': copy(resumen()); break;
    case 'permiso': try { await Notification.requestPermission(); } catch (er) { } renderMas(); break;
    case 'reset': if (confirm('Esto borra clientes, trabajos y cobros de este dispositivo. ¿Seguro? (Haz antes una copia de seguridad)') && confirm('¿Seguro del todo?')) { S = seedState(); await save(true); applyTheme(); go('hoy'); } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pq') { UI.f.q = t.value; clearTimeout(UI.qT); UI.qT = setTimeout(() => { renderProspectos(); const q = $('#pq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); return; }
  if (t.dataset.k && UI.kit) { const k = S.kits[UI.kit]; k[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.dataset.k === 'wa' || t.dataset.k === 'tel' ? t.value.replace(/[^\d]/g, '') : t.value; if (t.dataset.k === 'nombre') k.slug = slugify(t.value) + '-' + k.id.slice(-4); k.updated = Date.now(); save(); return; }
  if (t.dataset.s) { const sv = set(); sv[t.dataset.s] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? (+t.value || 0) : t.value; save(); if (t.dataset.s === 'ahorro') applyTheme(); }
});
document.addEventListener('change', async e => {
  const t = e.target; if (!t.dataset.img || !UI.kit) return;
  const k = S.kits[UI.kit], files = [...t.files]; if (!files.length) return;
  toast('Procesando imagen…');
  if (t.dataset.img === 'fotos') { for (const f of files.slice(0, 8 - k.fotos.length)) { const d = await comprimir(f, 1100, .72); if (d) k.fotos.push(d); } }
  else { const d = await comprimir(files[0], t.dataset.img === 'logo' ? 400 : 800, .85); if (d) k[t.dataset.img] = d; }
  k.updated = Date.now(); save(); renderTaller();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- arranque ---------- */
(async function init() {
  await load(); applyTheme();
  addEventListener('online', () => { UI.online = true; status(); if (UI.scr === 'hoy') renderHoy(); toast('Volvió la conexión: es buen momento para enviar los mensajes en cola.'); notify('Volvió la conexión', 'Envía ahora los mensajes pendientes.'); });
  addEventListener('offline', () => { UI.online = false; status(); if (UI.scr === 'hoy') renderHoy(); });
  try { const b = await navigator.getBattery?.(); if (b) { UI.bat = b; const up = () => { status(); }; b.addEventListener('levelchange', up); b.addEventListener('chargingchange', up); } } catch (e) { }
  go('hoy'); status();
  setInterval(tick, 1000);
  let lastDue = allTasks().filter(x => !x.opt && x.late > 0).length;
  setInterval(() => { status(); const late = allTasks().filter(x => !x.opt && x.late > 0).length; if (late > lastDue && document.hidden) notify('Tienes tareas atrasadas', late + ' pendientes de días anteriores.'); lastDue = late; }, 6e4);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  window.__HX = { S: () => S, allTasks, plan, msgFor, tarjetaHTML, menuHTML, cartelHTML, imagenPNG, zip };
})();

</script>
